name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Online unit tests
        run: ./gradlew testOnlineDebugUnitTest

      - name: Run Online lint
        run: ./gradlew lintOnlineDebug

      - name: Build Online debug APK
        run: ./gradlew assembleOnlineDebug

      - name: Verify Online APK
        run: |
          APK="app/build/outputs/apk/online/debug/app-online-debug.apk"
          test -s "$APK"
          sha256sum "$APK"

      - name: Upload Online APK
        uses: actions/upload-artifact@v7
        with:
          name: mobile-harness-online-debug
          path: app/build/outputs/apk/online/debug/app-online-debug.apk
          if-no-files-found: error
          retention-days: 30

